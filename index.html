<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>معركة التمارين</title>
<style>
body{margin:0;background:#1c2438;color:#dbe4ff;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:10px;box-sizing:border-box}
.s{display:none}.s.on{display:block}
button{width:100%;padding:13px;margin:4px 0;border-radius:10px;border:0;background:#2b3652;color:#fff;font-size:17px}
.pri{background:#4c8dff;font-weight:bold}
h2{margin:6px 0;color:#f5d76e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{padding:22px 6px;font-size:18px}
.card{background:#2b3652;border-radius:10px;padding:10px;margin-top:8px;line-height:1.7}
.card ol{margin:4px 0;padding-inline-start:22px}
.red{color:#ff5a6e;font-weight:bold}
#fig,#gimg{width:100%;background:#e9ecf3;border-radius:10px}
#tg{width:90px;font-size:22px;text-align:center;border-radius:8px;border:0;padding:6px;margin-inline-start:8px}
.row{display:flex;gap:6px}
.mon{background:#39435c;padding:8px 12px;border-radius:8px}
#mn{color:#f5d76e;font-size:22px}
.hp{position:relative;height:26px;background:#222b40;margin-top:4px;border-radius:4px;overflow:hidden}
#hpb{position:absolute;inset:0 auto 0 0;background:#ef5b6b;width:100%;transition:width .2s}
#hpt{position:absolute;inset:0;text-align:center;line-height:26px}
.cam{position:relative;margin-top:6px;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:3/4}
video{display:none}#c{width:100%;height:100%;object-fit:cover}
.bar{position:absolute;left:10px;top:20%;height:55%;width:16px;background:#39435c;border-radius:8px;overflow:hidden}
#pb{position:absolute;bottom:0;width:100%;background:#3ddc84;height:0}
.dmg{text-align:center;background:#2b3652;border-radius:8px;margin-top:6px;padding:8px}
#d{font-size:52px;color:#4c8dff;display:block}
#hint{color:#7fa8ff;font-size:19px;margin:4px}
</style></head><body><div id="app">

<div class="s on" id="s1"><h2>اختر التمرين</h2><div class="grid" id="grid"></div></div>

<div class="s" id="s2"><button onclick="show('s1')" style="width:auto;padding:8px 16px">→ رجوع</button>
<h2 id="gt"></h2><canvas id="fig" width="300" height="240"></canvas><img id="gimg" alt="">
<div class="card"><b>طريقة الأداء:</b><ol id="gs"></ol>
<div>💪 العضلات المستهدفة (باللون الأحمر): <span class="red" id="gm"></span></div>
<div>📱 وضع الكاميرا: <span id="gc"></span></div></div>
<div class="card">🎯 عدد التكرارات التي تريدها: <input id="tg" type="number" value="10" min="1" max="500" inputmode="numeric"></div>
<button class="pri" onclick="startBattle()">ابدأ المعركة ⚔️</button></div>

<div class="s" id="s3"><button onclick="stopCam();show('s2')" style="width:auto;padding:8px 16px">→ رجوع</button>
<div class="row"><button onclick="flip()">🔄 تبديل الكاميرا</button><button id="snd" onclick="toggleSnd()">🔊 الصوت</button></div>
<div class="mon"><span id="mn"></span><div class="hp"><div id="hpb"></div><div id="hpt"></div></div></div>
<div class="cam"><video id="v" playsinline muted></video><canvas id="c"></canvas><div class="bar"><div id="pb"></div></div></div>
<div class="dmg"><span id="d">0</span>الضرر المُنفَّذ<p id="hint"></p></div>
<button onclick="again()">🔁 جولة جديدة</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const ang=(a,b,c)=>{let d=Math.abs((Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x))*180/Math.PI);return d>180?360-d:d};
const avg=(L,t)=>{const v=t.filter(s=>s.every(i=>(L[i].visibility??1)>.4));return v.length?v.reduce((s,x)=>s+ang(L[x[0]],L[x[1]],L[x[2]]),0)/v.length:null};
const ELB=[[11,13,15],[12,14,16]],KNEE=[[23,25,27],[24,26,28]],HIP=[[11,23,25],[12,24,26]];
// وضعيات الشخصية: hp ورك، sh كتف، wr معصم، an كاحل (إحداثيات) — الركب والمرافق تُحسب تلقائياً
const gp=o=>({hp:o.hp,sh:o.sh,wr:o.wr,an:o.an,wr2:o.wr2||o.wr,an2:o.an2||o.an,eb:o.eb??1,hd:o.hd??0,fa:o.fa??0});
const HP=[150,125],SH=[150,73],AN=[150,219];
const EX={
pushup:{n:"ضغط (Push-up)",m:L=>avg(L,ELB),lo:90,hi:155,h:["انزل أكثر!","ادفع للأعلى!"],
 A:gp({hp:[127.7,178.2],sh:[172,161],wr:[172,219],an:[40,212],hd:25,fa:75}),B:gp({hp:[132.9,197.8],sh:[184,190],wr:[172,219],an:[40,212],hd:25,fa:75}),
 mus:[0,1,2],mn:"الصدر، الترايسبس، الأكتاف",cam:"ضع الجوال على الأرض من الجانب ليظهر جسمك كاملاً",
 st:["ضع يديك أوسع قليلاً من كتفيك","اجعل جسمك خطاً مستقيماً من الرأس للكعب","انزل حتى ينثني المرفق 90°","ادفع للأعلى حتى يستقيم الذراع"]},
squat:{n:"سكوات (Squat)",m:L=>avg(L,KNEE),lo:100,hi:160,h:["اجلس أعمق!","قف!"],
 A:gp({hp:HP,sh:SH,wr:[198,80],an:AN}),B:gp({hp:[122,168],sh:[154,127],wr:[200,122],an:AN}),
 mus:[3,4,2],mn:"الفخذ الأمامي، الأرداف، أسفل الظهر",cam:"ضع الجوال أمامك أو من الجانب على بعد مترين",
 st:["قدماك بعرض الكتفين","ادفع الأرداف للخلف كأنك تجلس على كرسي","انزل حتى يوازي فخذاك الأرض","ادفع بكعبيك للأعلى"]},
lunge:{n:"لانجز (Lunge)",m:L=>avg(L,KNEE),lo:110,hi:160,h:["انزل!","ارتفع!"],
 A:gp({hp:HP,sh:SH,wr:[140,120],an:AN}),B:gp({hp:[140,178],sh:[140,126],wr:[132,172],an:[190,219],an2:[98,206]}),
 mus:[3,4],mn:"الفخذ، الأرداف",cam:"من الجانب على بعد مترين",
 st:["خذ خطوة كبيرة للأمام","انزل حتى تنثني الركبتان 90°","ابقَ الجذع مستقيماً","ادفع للعودة للوقوف"]},
situp:{n:"بطن (Sit-up)",m:L=>avg(L,HIP),lo:90,hi:140,h:["ارفع جذعك!","استلقِ!"],
 A:gp({hp:[150,211],sh:[98,211],wr:[92,192],an:[182,219],eb:-1}),B:gp({hp:[150,211],sh:[141,161],wr:[147,141],an:[182,219],eb:-1}),
 mus:[2],mn:"عضلات البطن",cam:"من الجانب مع ظهور الجسم كاملاً",
 st:["استلقِ وثبّت قدميك مع ثني الركبتين","ضع يديك خلف رأسك","ارفع جذعك حتى تقترب من ركبتيك","انزل ببطء"]},
curl:{n:"بايسبس كيرل",m:L=>avg(L,ELB),lo:50,hi:140,h:["اثنِ المرفق!","انزل ببطء!"],
 A:gp({hp:HP,sh:SH,wr:[153,131],wr2:[150,131],an:AN}),B:gp({hp:HP,sh:SH,wr:[177,84],wr2:[150,131],an:AN}),
 mus:[0,1],mn:"البايسبس والساعد",cam:"من الجانب أو الأمام، وذراعك ظاهرة",
 st:["قف مستقيماً وثبّت المرفق بجانبك","ارفع اليد نحو الكتف","اعصر العضلة لحظة","انزل ببطء"]},
press:{n:"ضغط أكتاف",m:L=>avg(L,ELB),lo:95,hi:160,h:["اخفض يديك!","ادفع للأعلى!"],
 A:gp({hp:HP,sh:SH,wr:[164,48],an:AN}),B:gp({hp:HP,sh:SH,wr:[152,16],an:AN}),
 mus:[0,1],mn:"الأكتاف والترايسبس",cam:"من الأمام، وذراعاك ظاهرتان",
 st:["ابدأ بيديك عند مستوى الكتفين","ادفع للأعلى حتى تستقيم الذراعان","لا تقوّس ظهرك","انزل ببطء"]},
jack:{n:"جامبينج جاك",m:L=>((L[15].y+L[16].y)/2-L[0].y)*100,lo:0,hi:25,h:["ارفع يديك فوق رأسك!","انزل يديك!"],mir:1,
 A:gp({hp:HP,sh:SH,wr:[176,132],an:[158,219]}),B:gp({hp:[150,133],sh:[150,81],wr:[203,26],an:[187,219]}),
 mus:[0,1,3,4],mn:"الأكتاف، الفخذ، السمانة",cam:"من الأمام ليظهر جسمك كاملاً",
 st:["قف وقدماك مجتمعتان","اقفز وباعد قدميك وارفع ذراعيك","ثم عد للوضع الأول","حافظ على إيقاع ثابت"]}
};
let cur,target=10;
Object.entries(EX).forEach(([k,e])=>{const b=document.createElement("button");b.textContent=e.n;b.onclick=()=>pick(k);$("grid").append(b)});
function show(id){document.querySelectorAll(".s").forEach(s=>s.classList.toggle("on",s.id===id))}
const gi=$("gimg");gi.onload=()=>{gi.style.display="block";$("fig").style.display="none"};gi.onerror=()=>{gi.style.display="none";$("fig").style.display="block"};
function pick(k){cur=k;const e=EX[k];$("gt").textContent=e.n;$("gs").innerHTML=e.st.map(x=>"<li>"+x+"</li>").join("");$("gm").textContent=e.mn;$("gc").textContent=e.cam;
 gi.style.display="none";$("fig").style.display="block";gi.src="img/"+k+".gif";show("s2")}
// ===== شخصية عضلية (أجزاء مفصلية بعضلات) =====
const fc=$("fig").getContext("2d");
const mixp=(a,b,t)=>{const r={};for(const k in a)r[k]=Array.isArray(a[k])?a[k].map((v,i)=>v+(b[k][i]-v)*t):a[k]+(b[k]-a[k])*t;return r};
function ik(S,W,l1,l2,sg){let dx=W[0]-S[0],dy=W[1]-S[1],d=Math.hypot(dx,dy)||1;const m=l1+l2-.1;if(d>m){dx*=m/d;dy*=m/d;d=m}
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a)),ux=dx/d,uy=dy/d;
 return [[S[0]+ux*a-uy*h*sg,S[1]+uy*a+ux*h*sg],[S[0]+dx,S[1]+dy]]}
const Q=s=>new Path2D(s),EL=(x,y,rx,ry)=>{const h=new Path2D();h.ellipse(x,y,rx,ry,0,0,7);return h};
const PT={
 arm:[Q("M-6 32C-10 24-11 12-9 0C-8-12 12-12 12 0C13 8 11 18 6 32Z")],
 fore:[Q("M-6 0C-8 8-6 18-4 28L4 28C5 20 9 10 8 0Z"),EL(1,33,5.5,7)],
 thigh:[Q("M-12 0C-16 14-13 34-9 48L9 48C19 36 20 16 14 0Z")],
 shin:[Q("M-8 0C-14 8-12 22-4 46L4 46C5 30 8 12 9 0Z")],
 foot:[Q("M-4-3L-4 16C-4 19 1 19 2 16L4 2C5-1 5-3 4-3Z")],
 torso:[Q("M-12-6C-16 10-14 30-11 52L13 52C13 40 12 32 15 22C21 14 22 4 14-4C8-10-4-10-12-6Z")],
 torsoF:[Q("M-22-2C-24 10-14 28-12 52L12 52C14 28 24 10 22-2C12-10-12-10-22-2Z")],
 tsh:[Q("M-12 40C-17 50-15 60-8 62L15 60L15 40Z")],
 tshF:[Q("M-13 42L13 42C16 50 16 58 14 62L1 62L0 55L-1 62L-14 62C-16 58-16 50-13 42Z")],
 ush:[Q("M-13-3C-16 10-15 22-13 26L16 26C17 14 16 4 14-3Z")]};
const DT={
 arm:[Q("M4 8C8 12 8 18 5 24"),Q("M-4 10C-6 16-5 22-3 28"),Q("M2-8C4-2 4 4 3 10")],
 fore:[Q("M0 4C2 12 2 20 1 26"),Q("M-3 6C-4 14-3 20-2 26")],
 thigh:[Q("M6 6C12 18 12 32 6 44"),Q("M-2 8C-6 22-5 34-2 44"),Q("M3 44C5 46 8 46 9 44")],
 shin:[Q("M-2 8C-6 20-4 32 0 42"),Q("M3 6C4 20 3 34 2 44")],
 torso:[Q("M6 14C14 20 20 16 21 8"),Q("M8 28L15 27"),Q("M8 35L14 34"),Q("M8 42L13 41"),Q("M-8 14C-6 24-6 34-5 44")],
 torsoF:[Q("M-21 6C-14 16-5 16 0 10C5 16 14 16 21 6"),Q("M0 12L0 48"),Q("M-10 24L10 24"),Q("M-9 34L9 34"),Q("M-8 43L8 43"),Q("M-16 20C-14 30-12 40-11 48"),Q("M16 20C14 30 12 40 11 48")]};
const ph=(a,b)=>Math.atan2(-(b[0]-a[0]),b[1]-a[1]);
function part(o,ang,paths,det,o2){
 fc.save();fc.translate(o[0],o[1]);fc.rotate(ang);if(o2.sy)fc.scale(1,o2.sy);
 if(o2.flat)fc.fillStyle=o2.flat;else{const g=fc.createLinearGradient(-16,0,18,0),c=o2.far?["#111216","#1b1e24","#292c34"]:["#16181d","#343843","#666d7d"];g.addColorStop(0,c[0]);g.addColorStop(.5,c[1]);g.addColorStop(1,c[2]);fc.fillStyle=g}
 paths.forEach(q=>fc.fill(q));
 if(o2.mus){fc.save();fc.shadowColor="#ff2244";fc.shadowBlur=14;fc.globalAlpha=.3+.55*o2.p;const r=fc.createLinearGradient(-16,0,18,0);r.addColorStop(0,"#a3132c");r.addColorStop(.6,"#e8304e");r.addColorStop(1,"#ff7a90");fc.fillStyle=r;paths.forEach(q=>fc.fill(q));fc.restore()}
 fc.lineJoin="round";fc.lineWidth=1.6;fc.strokeStyle="#08090b";paths.forEach(q=>fc.stroke(q));
 if(!o2.far&&det){fc.lineWidth=1.1;fc.strokeStyle="rgba(0,0,0,.6)";det.forEach(q=>fc.stroke(q))}
 fc.restore()}
function figure(e,Z,p){
 const mir=e.mir,sx=mir?20:0,hx=mir?9:0,M=new Set(e.mus);
 let ux=Z.sh[0]-Z.hp[0],uy=Z.sh[1]-Z.hp[1];const ul=Math.hypot(ux,uy);ux/=ul;uy/=ul;
 const r=Z.hd*Math.PI/180,vx=ux*Math.cos(r)-uy*Math.sin(r),vy=ux*Math.sin(r)+uy*Math.cos(r);
 const H=[Z.sh[0]+vx*20,Z.sh[1]+vy*20],aS=[Z.sh[0]+sx,Z.sh[1]],lS=[Z.hp[0]+hx,Z.hp[1]],fr=Z.fa*Math.PI/180;
 const arm=w=>{const[E,W]=ik(aS,w,32,28,Z.eb);return{S:aS,E,W}},leg=a=>{const[K,A]=ik(lS,a,48,46,-1);return{S:lS,K,A}};
 const A1=arm(Z.wr),A2=arm(Z.wr2),L1=leg(Z.an),L2=leg(Z.an2);
 const drawLeg=(l,far)=>{part(l.K,ph(l.K,l.A),PT.shin,DT.shin,{far,p,mus:M.has(4)});
  part(l.A,Math.atan2(-Math.cos(fr),Math.sin(fr)),PT.foot,null,{far,p});
  part(l.S,ph(l.S,l.K),PT.thigh,DT.thigh,{far,p,mus:M.has(3)});
  if(!far)part(l.S,ph(l.S,l.K),PT.ush,null,{flat:"#15161a"})};
 const drawArm=(a,far)=>{part(a.S,ph(a.S,a.E),PT.arm,DT.arm,{far,p,mus:M.has(0)});part(a.E,ph(a.E,a.W),PT.fore,DT.fore,{far,p,mus:M.has(1)})};
 const both=fn=>{fn();fc.save();fc.translate(300,0);fc.scale(-1,1);fn();fc.restore()};
 if(!mir){fc.save();fc.translate(-9,0);drawLeg(L2,1);drawArm(A2,1);fc.restore();drawLeg(L1,0)}else both(()=>drawLeg(L1,0));
 const tl=Math.hypot(Z.hp[0]-Z.sh[0],Z.hp[1]-Z.sh[1]),ta=ph(Z.sh,Z.hp),sy=tl/52;
 part(Z.sh,ta,mir?PT.torsoF:PT.torso,mir?DT.torsoF:DT.torso,{p,mus:M.has(2),sy});
 part(Z.sh,ta,mir?PT.tshF:PT.tsh,null,{flat:"#15161a",sy});
 fc.lineCap="round";[[15,"#08090b"],[11,"#2b2e36"]].forEach(([w,c])=>{fc.strokeStyle=c;fc.lineWidth=w;fc.beginPath();fc.moveTo(Z.sh[0],Z.sh[1]);fc.lineTo(H[0],H[1]);fc.stroke()});
 fc.save();fc.translate(H[0],H[1]);fc.rotate(Math.atan2(vy,vx)+Math.PI/2);
 const hg=fc.createRadialGradient(3,-3,2,0,0,14);hg.addColorStop(0,"#6a7080");hg.addColorStop(1,"#1f2228");fc.fillStyle=hg;
 const hd=EL(0,0,10.5,12.5);fc.fill(hd);fc.lineWidth=1.6;fc.strokeStyle="#08090b";fc.stroke(hd);
 fc.fillStyle="#fff";(mir?[[-4.5,-1],[4.5,-1]]:[[3,-1],[8.5,-1]]).forEach(([x,y])=>{fc.beginPath();fc.ellipse(x,y,2.4,3.4,0,0,7);fc.fill()});fc.restore();
 if(mir)both(()=>drawArm(A1,0));else drawArm(A1,0)}
function figLoop(t){
 if($("s2").classList.contains("on")&&cur&&$("fig").style.display!=="none"){const e=EX[cur],p=(1-Math.cos(t/450))/2;
  fc.fillStyle="#e9ecf3";fc.fillRect(0,0,300,240);fc.strokeStyle="#b8bdca";fc.lineWidth=3;fc.beginPath();fc.moveTo(0,226);fc.lineTo(300,226);fc.stroke();
  figure(e,mixp(e.A,e.B,p),p)}
 requestAnimationFrame(figLoop)}
requestAnimationFrame(figLoop);
// ===== الصوت =====
let snd=true,ac;
function toggleSnd(){snd=!snd;$("snd").textContent=snd?"🔊 الصوت":"🔇 صامت"}
function beep(f,d=.12,at=0){if(!snd)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.2;const t=ac.currentTime+at;o.start(t);o.stop(t+d)}
function say(t){if(!snd||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";speechSynthesis.speak(u)}
// ===== المعركة =====
const MON=["غوبلن","أورك","ذئب","تنين"];
let level=0,hp=0,max=0,total=0,state=null,lm,run=false,last=-1,Lib,facing="user",done=false,lid=0;
function spawn(){max=hp=target;total=0;state=null;done=false;$("mn").textContent=MON[level%4]+" (جولة "+(level+1)+")";drw()}
function drw(){$("hpb").style.width=hp/max*100+"%";$("hpt").textContent=hp+" / "+max;$("d").textContent=total}
function stopCam(){run=false;$("v").srcObject?.getTracks().forEach(t=>t.stop())}
function again(){level++;spawn();if(run)$("hint").textContent="ابدأ!"}
async function openCam(){
 const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}}});
 const v=$("v");v.srcObject=s;await v.play();$("c").style.transform=facing==="user"?"scaleX(-1)":"none";last=-1;run=true;loop(++lid)}
async function flip(){
 facing=facing==="user"?"environment":"user";if(!run)return;
 stopCam();try{await openCam()}catch(e){$("hint").textContent="⚠️ "+e.message}}
async function startBattle(){
 target=Math.max(1,Math.min(500,parseInt($("tg").value)||10));level=0;spawn();show("s3");$("hint").textContent="جارٍ تحميل نموذج التتبع...";
 try{
  if(!window.isSecureContext)throw new Error("الكاميرا تحتاج رابط https");
  if(!navigator.mediaDevices)throw new Error("المتصفح لا يدعم الكاميرا");
  if(!lm){Lib=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
   const f=await Lib.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
   const mk=d=>Lib.PoseLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},runningMode:"VIDEO",numPoses:1});
   try{lm=await mk("GPU")}catch(_){lm=await mk("CPU")}}
  stopCam();await openCam();$("hint").textContent="ابدأ التمرين!";beep(600);
 }catch(e){$("hint").textContent="⚠️ "+e.message}}
function loop(id){
 if(!run||id!==lid)return;const v=$("v"),c=$("c"),x=c.getContext("2d");
 if(v.videoWidth&&v.currentTime!==last){last=v.currentTime;c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
  const r=lm.detectForVideo(v,performance.now());
  if(r.landmarks[0]){const L=r.landmarks[0],du=new Lib.DrawingUtils(x);
   du.drawConnectors(L,Lib.PoseLandmarker.POSE_CONNECTIONS,{color:"#4c8dff",lineWidth:4});du.drawLandmarks(L,{color:"#9cc0ff",radius:4});step(L)}}
 requestAnimationFrame(()=>loop(id))}
function step(L){
 if(done)return;const e=EX[cur],m=e.m(L);if(m==null)return;
 $("pb").style.height=Math.max(0,Math.min(1,(e.hi-m)/(e.hi-e.lo)))*100+"%";
 if(m>e.hi){if(state==="low")rep();state="high"}else if(m<e.lo){if(state!=="low")beep(330,.05);state="low"}
 if(state&&!done)$("hint").textContent=state==="low"?e.h[1]:e.h[0]}
